<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 260">
  <defs>
    <g id="spark" stroke="#CC785C" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-9" x2="0" y2="-15"/>
      <line x1="0" y1="9" x2="0" y2="15"/>
      <line x1="-9" y1="0" x2="-15" y2="0"/>
      <line x1="9" y1="0" x2="15" y2="0"/>
      <line x1="-6" y1="-6" x2="-10.5" y2="-10.5"/>
      <line x1="6" y1="6" x2="10.5" y2="10.5"/>
      <line x1="-6" y1="6" x2="-10.5" y2="10.5"/>
      <line x1="6" y1="-6" x2="10.5" y2="-10.5"/>
    </g>
    <clipPath id="type0"><rect x="500" y="145" height="40" width="0">
      <animate attributeName="width" values="0;400;400;0;0" keyTimes="0;0.06;0.2;0.201;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type1"><rect x="500" y="145" height="40" width="0">
      <animate attributeName="width" values="0;0;400;400;0;0" keyTimes="0;0.2;0.26;0.4;0.401;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="500" y="145" height="40" width="0">
      <animate attributeName="width" values="0;0;400;400;0;0" keyTimes="0;0.4;0.46;0.6;0.601;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="500" y="145" height="40" width="0">
      <animate attributeName="width" values="0;0;400;400;0;0" keyTimes="0;0.6;0.66;0.8;0.801;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="500" y="145" height="40" width="0">
      <animate attributeName="width" values="0;0;400;400;0" keyTimes="0;0.8;0.86;0.999;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1400" height="260" fill="#F0EEE6"/>

  <!-- agentic network: left cluster -->
  <g stroke="#DCD6C8" stroke-width="1.5" fill="none">
    <path d="M 100 60 L 220 42"/>
    <path d="M 220 42 L 300 120"/>
    <path d="M 300 120 L 180 152"/>
    <path d="M 180 152 L 100 60"/>
    <path d="M 180 152 L 82 202"/>
    <path d="M 300 120 L 262 222"/>
    <path d="M 62 122 L 100 60"/>
    <path d="M 62 122 L 82 202"/>
    <path d="M 340 52 L 220 42"/>
    <path d="M 340 52 L 300 120"/>
    <path d="M 382 190 L 300 120"/>
    <path d="M 382 190 L 262 222"/>
  </g>
  <!-- right cluster -->
  <g stroke="#DCD6C8" stroke-width="1.5" fill="none">
    <path d="M 1300 70 L 1180 46"/>
    <path d="M 1180 46 L 1100 122"/>
    <path d="M 1100 122 L 1220 160"/>
    <path d="M 1220 160 L 1300 70"/>
    <path d="M 1220 160 L 1320 210"/>
    <path d="M 1100 122 L 1142 230"/>
    <path d="M 1340 132 L 1300 70"/>
    <path d="M 1340 132 L 1320 210"/>
    <path d="M 1060 58 L 1180 46"/>
    <path d="M 1060 58 L 1100 122"/>
    <path d="M 1022 200 L 1100 122"/>
    <path d="M 1022 200 L 1142 230"/>
  </g>

  <!-- agent nodes -->
  <g>
    <circle cx="100" cy="60" r="7" fill="#CC785C"/>
    <circle cx="220" cy="42" r="5" fill="#191919"/>
    <circle cx="300" cy="120" r="9" fill="#CC785C">
      <animate attributeName="r" values="9;11;9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="152" r="5" fill="#191919"/>
    <circle cx="82" cy="202" r="6" fill="#CC785C"/>
    <circle cx="62" cy="122" r="4" fill="#A8A296"/>
    <circle cx="340" cy="52" r="4" fill="#A8A296"/>
    <circle cx="262" cy="222" r="5" fill="#191919"/>
    <circle cx="382" cy="190" r="6" fill="#CC785C"/>
  </g>
  <g>
    <circle cx="1300" cy="70" r="7" fill="#CC785C"/>
    <circle cx="1180" cy="46" r="5" fill="#191919"/>
    <circle cx="1100" cy="122" r="9" fill="#CC785C">
      <animate attributeName="r" values="9;11;9" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1220" cy="160" r="5" fill="#191919"/>
    <circle cx="1320" cy="210" r="6" fill="#CC785C"/>
    <circle cx="1340" cy="132" r="4" fill="#A8A296"/>
    <circle cx="1060" cy="58" r="4" fill="#A8A296"/>
    <circle cx="1142" cy="230" r="5" fill="#191919"/>
    <circle cx="1022" cy="200" r="6" fill="#CC785C"/>
  </g>

  <!-- pulses traveling between agents -->
  <circle r="3.5" fill="#CC785C">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 100 60 L 220 42 L 300 120 L 180 152 L 100 60"/>
  </circle>
  <circle r="3" fill="#191919">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M 82 202 L 180 152 L 300 120 L 340 52"/>
  </circle>
  <circle r="3.5" fill="#CC785C">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 1300 70 L 1180 46 L 1100 122 L 1220 160 L 1300 70"/>
  </circle>
  <circle r="3" fill="#191919">
    <animateMotion dur="5.2s" repeatCount="indefinite" path="M 1320 210 L 1220 160 L 1100 122 L 1060 58"/>
  </circle>

  <!-- sun spark, top center, clear of the wordmark -->
  <g transform="translate(700,34)">
    <g stroke="#CC785C" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-11" x2="0" y2="-19"/>
      <line x1="0" y1="11" x2="0" y2="19"/>
      <line x1="-11" y1="0" x2="-19" y2="0"/>
      <line x1="11" y1="0" x2="19" y2="0"/>
      <line x1="-8" y1="-8" x2="-13.5" y2="-13.5"/>
      <line x1="8" y1="8" x2="13.5" y2="13.5"/>
      <line x1="-8" y1="8" x2="-13.5" y2="13.5"/>
      <line x1="8" y1="-8" x2="13.5" y2="-13.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating claude sparks -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="430 62;430 54;430 62" dur="5s" repeatCount="indefinite"/>
    <g transform="scale(0.7)"><use href="#spark"/></g>
  </g>
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="972 74;972 82;972 74" dur="6.2s" repeatCount="indefinite"/>
    <g transform="scale(0.55)"><use href="#spark"/></g>
  </g>
  <g opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="452 208;452 200;452 208" dur="5.6s" repeatCount="indefinite"/>
    <g transform="scale(0.6)"><use href="#spark"/></g>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="948 214;948 222;948 214" dur="4.8s" repeatCount="indefinite"/>
    <g transform="scale(0.75)"><use href="#spark"/></g>
  </g>
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="700 236;700 230;700 236" dur="6.8s" repeatCount="indefinite"/>
    <g transform="scale(0.5)"><use href="#spark"/></g>
  </g>

  <!-- wordmark: Claude Code terminal style -->
  <text x="700" y="118" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Consolas,Menlo,'Courier New',monospace" font-weight="bold" font-size="58" fill="#191919"><tspan fill="#CC785C">❯ </tspan>Sharvin Goyal</text>
  <rect x="988" y="74" width="20" height="50" fill="#CC785C">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- typed focus areas, cycling on the banner itself -->
  <g font-family="'Cascadia Code','SF Mono',Consolas,Menlo,'Courier New',monospace" font-size="22" fill="#CC785C">
    <g clip-path="url(#type0)"><text x="700" y="172" text-anchor="middle">LLMs · evals &amp; benchmarks</text></g>
    <g clip-path="url(#type1)"><text x="700" y="172" text-anchor="middle">mechanistic interpretability</text></g>
    <g clip-path="url(#type2)"><text x="700" y="172" text-anchor="middle">alignment &amp; AI safety</text></g>
    <g clip-path="url(#type3)"><text x="700" y="172" text-anchor="middle">representation geometry</text></g>
    <g clip-path="url(#type4)"><text x="700" y="172" text-anchor="middle">multi-agent failure modes</text></g>
  </g>

  <!-- baseline rule -->
  <line x1="560" y1="200" x2="840" y2="200" stroke="#CC785C" stroke-width="2"/>
</svg>
