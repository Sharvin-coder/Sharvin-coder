<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440">
  <defs>
    <g id="spark" stroke="#CC785C" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-9" x2="0" y2="-15"/>
      <line x1="0" y1="9" x2="0" y2="15"/>
      <line x1="-9" y1="0" x2="-15" y2="0"/>
      <line x1="9" y1="0" x2="15" y2="0"/>
      <line x1="-6" y1="-6" x2="-10.5" y2="-10.5"/>
      <line x1="6" y1="6" x2="10.5" y2="10.5"/>
      <line x1="-6" y1="6" x2="-10.5" y2="10.5"/>
      <line x1="6" y1="-6" x2="10.5" y2="-10.5"/>
    </g>
    <g id="bot">
      <line x1="0" y1="-15" x2="0" y2="-24" stroke="#CC785C" stroke-width="2.5"/>
      <circle cx="0" cy="-27" r="3" fill="#CC785C"/>
      <rect x="-18" y="-15" width="36" height="30" rx="8" fill="#EAE5D9" stroke="#C9C2B2" stroke-width="1.5"/>
      <circle cx="-7" cy="0" r="3.5" fill="#191919"/>
      <circle cx="7" cy="0" r="3.5" fill="#191919"/>
    </g>
    <g id="win">
      <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#FAF9F5" stroke="#C9C2B2" stroke-width="1.5"/>
      <circle cx="-16" cy="-9" r="2" fill="#CC785C"/>
      <circle cx="-9" cy="-9" r="2" fill="#A8A296"/>
      <circle cx="-2" cy="-9" r="2" fill="#A8A296"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#D8D3C8" stroke-width="3" stroke-linecap="round"/>
      <line x1="-16" y1="8" x2="6" y2="8" stroke="#D8D3C8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="bubble">
      <path d="M -22 -13 h 44 a 9 9 0 0 1 9 9 v 8 a 9 9 0 0 1 -9 9 h -30 l -10 9 v -9 h -4 a 9 9 0 0 1 -9 -9 v -8 a 9 9 0 0 1 9 -9 z" fill="#FFFFFF" stroke="#C9C2B2" stroke-width="1.5"/>
      <circle cx="-10" cy="0" r="2.5" fill="#CC785C">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2.5" fill="#CC785C">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="10" cy="0" r="2.5" fill="#CC785C">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <clipPath id="type0"><rect x="460" y="256" height="44" width="0">
      <animate attributeName="width" values="0;480;480;0;0" keyTimes="0;0.06;0.2;0.201;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type1"><rect x="460" y="256" height="44" width="0">
      <animate attributeName="width" values="0;0;480;480;0;0" keyTimes="0;0.2;0.26;0.4;0.401;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="460" y="256" height="44" width="0">
      <animate attributeName="width" values="0;0;480;480;0;0" keyTimes="0;0.4;0.46;0.6;0.601;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="460" y="256" height="44" width="0">
      <animate attributeName="width" values="0;0;480;480;0;0" keyTimes="0;0.6;0.66;0.8;0.801;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="460" y="256" height="44" width="0">
      <animate attributeName="width" values="0;0;480;480;0" keyTimes="0;0.8;0.86;0.999;1" dur="20s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1400" height="440" fill="#F0EEE6"/>

  <!-- message links (animated dashed flow) -->
  <g stroke="#D5CFC0" stroke-width="1.8" fill="none" stroke-dasharray="6 6">
    <path id="p1" d="M 140 110 C 190 140 210 175 245 200"/>
    <path id="p2" d="M 248 225 C 200 260 150 285 115 315"/>
    <path id="p3" d="M 300 87 C 280 125 265 160 254 198"/>
    <path id="p4" d="M 118 110 C 96 180 95 250 97 302"/>
    <path id="q1" d="M 1260 110 C 1210 140 1190 175 1155 200"/>
    <path id="q2" d="M 1152 225 C 1200 260 1250 285 1285 315"/>
    <path id="q3" d="M 1100 87 C 1120 125 1135 160 1146 198"/>
    <path id="q4" d="M 1282 110 C 1304 180 1305 250 1303 302"/>
    <path id="t1" d="M 632 50 L 768 50"/>
    <path id="b1" d="M 652 396 L 748 396"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- messages traveling between agents -->
  <circle r="3.5" fill="#CC785C"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="3" fill="#191919"><animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="3" fill="#CC785C"><animateMotion dur="5.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="2.5" fill="#A8A296"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  <circle r="3.5" fill="#CC785C"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#q1"/></animateMotion></circle>
  <circle r="3" fill="#191919"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#q2"/></animateMotion></circle>
  <circle r="3" fill="#CC785C"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#q3"/></animateMotion></circle>
  <circle r="2.5" fill="#A8A296"><animateMotion dur="5.8s" repeatCount="indefinite"><mpath href="#q4"/></animateMotion></circle>
  <circle r="3" fill="#CC785C"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
  <circle r="3" fill="#191919"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle>

  <!-- agents: left neighborhood -->
  <use href="#bot" x="125" y="95"/>
  <use href="#win" x="255" y="215"/>
  <use href="#bot" x="100" y="330"/>
  <use href="#win" x="310" y="70"/>
  <use href="#bubble" x="180" y="55">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.55;0.65;1" dur="7s" repeatCount="indefinite"/>
  </use>

  <!-- agents: right neighborhood -->
  <use href="#bot" x="1275" y="95"/>
  <use href="#win" x="1145" y="215"/>
  <use href="#bot" x="1300" y="330"/>
  <use href="#win" x="1090" y="70"/>
  <use href="#bubble" x="1225" y="55">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.4;0.85;0.95;1" dur="7s" repeatCount="indefinite"/>
  </use>

  <!-- agents: top + bottom center, clear of the wordmark -->
  <use href="#bot" x="605" y="48"/>
  <use href="#bot" x="795" y="48"/>
  <text x="700" y="30" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#A8A296">tool_call()</text>
  <use href="#win" x="620" y="395"/>
  <use href="#bot" x="782" y="397"/>
  <text x="700" y="430" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#A8A296">observe()</text>

  <!-- tiny labels -->
  <text x="205" y="160" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#A8A296">plan()</text>
  <text x="1155" y="160" text-anchor="end" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#A8A296">act()</text>

  <!-- floating claude sparks -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="400 160;400 152;400 160" dur="5s" repeatCount="indefinite"/>
    <g transform="scale(0.7)"><use href="#spark"/></g>
  </g>
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="1015 305;1015 313;1015 305" dur="6.2s" repeatCount="indefinite"/>
    <g transform="scale(0.55)"><use href="#spark"/></g>
  </g>
  <g opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="445 365;445 357;445 365" dur="5.6s" repeatCount="indefinite"/>
    <g transform="scale(0.6)"><use href="#spark"/></g>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="970 150;970 158;970 150" dur="4.8s" repeatCount="indefinite"/>
    <g transform="scale(0.75)"><use href="#spark"/></g>
  </g>

  <!-- wordmark: Claude Code terminal style -->
  <text x="700" y="225" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Consolas,Menlo,'Courier New',monospace" font-weight="bold" font-size="72" fill="#191919"><tspan fill="#CC785C">❯ </tspan>Sharvin Goyal</text>
  <rect x="1038" y="170" width="24" height="62" fill="#CC785C">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- typed focus areas, cycling on the banner itself -->
  <g font-family="'Cascadia Code','SF Mono',Consolas,Menlo,'Courier New',monospace" font-size="26" fill="#CC785C">
    <g clip-path="url(#type0)"><text x="700" y="287" text-anchor="middle">LLMs · evals &amp; benchmarks</text></g>
    <g clip-path="url(#type1)"><text x="700" y="287" text-anchor="middle">mechanistic interpretability</text></g>
    <g clip-path="url(#type2)"><text x="700" y="287" text-anchor="middle">alignment &amp; AI safety</text></g>
    <g clip-path="url(#type3)"><text x="700" y="287" text-anchor="middle">representation geometry</text></g>
    <g clip-path="url(#type4)"><text x="700" y="287" text-anchor="middle">multi-agent failure modes</text></g>
  </g>

  <!-- baseline rule -->
  <line x1="540" y1="318" x2="860" y2="318" stroke="#CC785C" stroke-width="2"/>
</svg>
